[platformio]
default_envs = poofer_uart

[board_common]
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Werror=return-type

; Bare ESP32-S3-WROOM-1-N8, 8 MB flash, no PSRAM.
; J7 uses a self-powered target and a 3.3 V USB/UART adapter.
[env:poofer_uart]
extends = board_common
build_flags =
    ${board_common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=0

; GPIO19/20 are native USB D-/D+ on the module breakout.
; Enable only with a suitable external USB interface/ESD implementation.
[env:poofer_usb]
extends = board_common
build_flags =
    ${board_common.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Compile verification of the supported software allocation limit.
; This environment does not establish a qualified physical cable length.
[env:poofer_chain32_compile]
extends = board_common
build_flags =
    ${board_common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_CHAIN_MODULES=32

[env:native]
platform = platformio/native@1.2.1
build_flags = -std=c++11 -Wall -Wextra -Werror -I include -D BOARD_CHAIN_MODULES=3
test_framework = unity
test_build_src = no
test_filter = test_*
